<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>打印机选购判断 · 本机试用</title><link rel="stylesheet" href="/style.css"></head><body><main><header><h1>先弄清需求，再决定怎么买</h1><p>打印机路线比较试用 · 不显示实时价格，不会加购或下单</p></header><section id="step1"><h2>1 · 说说你的需求</h2><label for="description">一句话描述</label><textarea id="description" rows="4" placeholder="例如：给孩子打印学习资料，偶尔彩色，预算1000元"></textarea><p class="hint">原话不会被自动理解成全部条件；下一步由你确认。数据默认只在本次页面内，刷新清空。</p><button id="next">补充条件</button></section><section id="step2" hidden><h2>2 · 补充关键条件</h2><p class="hint">未知就选“不确定”，不要猜。</p><div class="fields"><label>每月打印张数 <input id="monthly_pages" type="number" min="0" step="1" placeholder="不确定可留空"></label><label>预算上限（元） <input id="budget_max_cny" type="number" min="0" step="1" placeholder="不确定可留空"></label><label>最长连续闲置（周） <input id="idle_weeks" type="number" min="0" step="1" placeholder="不确定可留空"></label><label>是否需要彩色<select id="needs_color"><option value="">不确定</option><option value="true">需要</option><option value="false">不需要</option></select></label><label>能否外包彩印<select id="accepts_outsourced_color"><option value="">不确定</option><option value="true">可以</option><option value="false">不可以</option></select></label><label>是否必须无线/手机打印<select id="requires_wireless"><option value="">不确定</option><option value="true">需要</option><option value="false">不需要</option></select></label><label>是否必须扫描<select id="requires_scan"><option value="">不确定</option><option value="true">需要</option><option value="false">不需要</option></select></label></div><label for="requirements">其他硬性要求（每行一条，暂不自动解析）</label><textarea id="requirements" rows="3" placeholder="例如：必须在家彩印"></textarea><div class="actions"><button class="secondary" id="back1">返回修改描述</button><button id="review">确认系统理解</button></div></section><section id="step3" hidden><h2>3 · 核对理解</h2><p class="hint">以下条件完全来自你的选择，并非模型推断。原始文字中没转成选项的要求会保留为待核对事项。</p><div id="summary" class="result"></div><div class="actions"><button class="secondary" id="back2">修改条件</button><button id="submit">确认并判断</button></div></section><section id="step4" hidden><h2>4 · 本机判断</h2><div id="output" class="result" aria-live="polite"></div><div class="actions"><button class="secondary" id="back3">修改后重新判断</button><button class="secondary" id="export">预览评审记录</button></div><pre id="record" hidden></pre></section><p id="error" role="alert" hidden></p><footer>只做技术路线和证据缺口判断；13张研究卡未经独立批准，不用于强推荐。无账号、交易或云端上传。</footer></main><script src="/app.js" defer></script></body></html>
